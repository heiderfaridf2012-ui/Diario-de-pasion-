<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Una sorpresa para ti ❤️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #ffe6e8;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card-container {
      background: #ffffff;
      max-width: 450px;
      width: 100%;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(230, 57, 70, 0.2);
      padding: 30px;
      text-align: center;
      border: 2px solid #ffccd5;
    }
    .heart-icon {
      font-size: 50px;
      animation: pulse 1.2s infinite;
      cursor: pointer;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }
    h1 {
      color: #d62828;
      font-size: 24px;
      margin: 15px 0;
    }
    p.message {
      color: #4a4a4a;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 20px;
      white-space: pre-line;
    }
    .btn-surprise {
      background-color: #ff4d6d;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
    }
    .btn-surprise:hover {
      background-color: #c9184a;
      transform: translateY(-2px);
    }
    .hidden-content {
      display: none;
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px dashed #ffb3c1;
    }
    audio {
      margin-top: 15px;
      width: 100%;
      max-width: 300px;
    }
  </style>
</head>
<body>

  <div class="card-container">
    <div class="heart-icon" onclick="mostrarOculto()">❤️</div>
    <h1>Para la chica más especial ✨</h1>
    
    <p class="message">
      Hola mi amor, solo quería dejarte este pequeño detalle para recordarte lo mucho que te quiero y lo importante que eres para mí. 
    </p>

    <button class="btn-surprise" onclick="mostrarOculto()">¡Tócame aquí! 🎁</button>

    <div class="hidden-content" id="sorpresa">
      <p style="color: #c9184a; font-weight: bold; font-size: 18px;">
        ¡Gracias por sacarme siempre una sonrisa! 🥰
      </p>
      <p style="margin-top: 8px; color: #555;">
        Prometo estar siempre para ti y sacarte miles de sonrisas más. ¡Te adoro!
      </p>
      
      <!-- Música de fondo opcional -->
      <audio controls autoplay loop style="margin-top:20px;">
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
        Tu navegador no soporta el reproductor de audio.
      </audio>
    </div>
  </div>

  <script>
    function mostrarOculto() {
      const elemento = document.getElementById('sorpresa');
      if (elemento.style.display === 'block') {
        elemento.style.display = 'none';
      } else {
        elemento.style.display = 'block';
      }
    }
  </script>

</body>
</html>
